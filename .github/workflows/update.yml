name: Atualizar e publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *" # a cada hora
  workflow_dispatch: # botão "Run workflow" na aba Actions

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Buscar vídeos e Shorts novos
        run: node scripts/update.mjs

      - name: Salvar dados atualizados
        run: |
          if ! git diff --quiet data/videos.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/videos.json
            git commit -m "Atualiza lista de vídeos [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
